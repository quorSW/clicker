<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Clicker Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="config.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    * { -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --surface-hover: #1a1a26;
      --accent: #f59e0b;
      --accent-soft: rgba(245, 158, 11, 0.15);
      --accent-glow: rgba(245, 158, 11, 0.4);
      --success: #10b981;
      --text: #f4f4f5;
      --text-muted: #71717a;
      --border: rgba(255,255,255,0.08);
      --gradient-1: linear-gradient(135deg, #f59e0b 0%, #fbbf24 50%, #fcd34d 100%);
    }
    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 80% 50% at 50% -20%, var(--accent-soft), transparent);
      pointer-events: none;
      z-index: 0;
    }
    .app {
      position: relative;
      z-index: 1;
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 1rem;
      padding-bottom: calc(2rem + env(safe-area-inset-bottom));
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 0;
      margin-bottom: 0.5rem;
    }
    .logo {
      font-family: 'Unbounded', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      background: var(--gradient-1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .nav-tabs {
      display: flex;
      gap: 0.25rem;
      background: var(--surface);
      padding: 0.25rem;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .nav-tab {
      padding: 0.5rem 0.75rem;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-muted);
      background: transparent;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      white-space: nowrap;
    }
    .nav-tab:hover { color: var(--text); }
    .nav-tab.active { background: var(--accent-soft); color: var(--accent); }
    .panel { display: none; flex: 1; animation: fadeIn 0.3s ease; }
    .panel.active { display: flex; flex-direction: column; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .game-panel { padding: 0.5rem 0; }
    .score-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .score-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--gradient-1);
    }
    .score-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.25rem; }
    .score-display { font-family: 'Unbounded', sans-serif; font-size: 2.5rem; font-weight: 700; color: var(--accent); text-shadow: 0 0 40px var(--accent-glow); }
    .per-click { font-size: 0.85rem; color: var(--text-muted); margin-top: 0.5rem; }
    .per-click span { color: var(--success); font-weight: 600; }
    .click-zone { display: flex; justify-content: center; margin: 2rem 0; padding: 1rem; }
    .click-target {
      width: 200px;
      height: 200px;
      min-width: 200px;
      min-height: 200px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--surface) 0%, #1e1e2a 100%);
      border: 4px solid var(--accent);
      box-shadow: 0 0 40px var(--accent-soft);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease;
      user-select: none;
      touch-action: manipulation;
      position: relative;
      -webkit-user-select: none;
    }
    .click-target:hover { transform: scale(1.03); }
    .click-target:active { transform: scale(0.97); }
    .click-target span { font-size: 4rem; filter: drop-shadow(0 4px 20px rgba(245,158,11,0.3)); }
    .upgrades-title { font-size: 0.9rem; font-weight: 600; color: var(--text-muted); margin-bottom: 1rem; padding-left: 0.25rem; }
    .upgrades { display: grid; gap: 0.5rem; }
    .upgrade {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      transition: all 0.2s ease;
    }
    .upgrade:hover:not(.locked) { background: var(--surface-hover); border-color: rgba(245, 158, 11, 0.3); }
    .upgrade.locked { opacity: 0.5; cursor: not-allowed; }
    .upgrade.unlocked { cursor: pointer; }
    .upgrade-info h3 { font-size: 0.95rem; font-weight: 600; }
    .upgrade-info p { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.2rem; }
    .upgrade-cost { font-weight: 700; color: var(--accent); font-size: 1rem; }
    .stats-grid { display: grid; gap: 1rem; margin-top: 1rem; }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .stat-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--accent-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }
    .stat-info h3 { font-size: 0.8rem; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; }
    .stat-info p { font-family: 'Unbounded', sans-serif; font-size: 1.4rem; font-weight: 700; color: var(--accent); margin-top: 0.25rem; }
    .profile-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      margin-bottom: 1.5rem;
    }
    .profile-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--gradient-1);
      margin: 0 auto 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
    }
    .profile-section {
      margin-bottom: 1rem;
      padding: 1rem;
      background: var(--bg);
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .profile-section-title { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; }
    .profile-section-value { font-size: 1rem; font-weight: 600; }
    .profile-section-value.muted { font-weight: 400; color: var(--text-muted); }
    .profile-level {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin: 1rem 0;
      padding: 0.5rem 1rem;
      background: var(--accent-soft);
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--accent);
    }
    .profile-stats { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border); }
    .ranking-header { text-align: center; margin-bottom: 1.5rem; }
    .ranking-header h2 { font-family: 'Unbounded', sans-serif; font-size: 1.2rem; margin-bottom: 0.25rem; }
    .ranking-header p { font-size: 0.85rem; color: var(--text-muted); }
    .ranking-loading { text-align: center; padding: 2rem; color: var(--text-muted); }
    .ranking-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .rank-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.25rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .rank-item.player { border-color: var(--accent); box-shadow: 0 0 20px var(--accent-soft); }
    .rank-position {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Unbounded', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      flex-shrink: 0;
    }
    .rank-item:nth-child(1) .rank-position { background: linear-gradient(135deg, #ffd700, #ffb347); color: #1a1a1a; }
    .rank-item:nth-child(2) .rank-position { background: linear-gradient(135deg, #c0c0c0, #e8e8e8); color: #1a1a1a; }
    .rank-item:nth-child(3) .rank-position { background: linear-gradient(135deg, #cd7f32, #e6a35c); color: #1a1a1a; }
    .rank-info { flex: 1; }
    .rank-info .name { font-weight: 600; font-size: 0.95rem; }
    .rank-info .power { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.2rem; }
    .rank-score { font-family: 'Unbounded', sans-serif; font-weight: 700; color: var(--accent); font-size: 1.1rem; }
    .tg-badge { font-size: 0.7rem; background: #0088cc; color: white; padding: 0.2rem 0.5rem; border-radius: 6px; margin-left: 0.5rem; }
    
    /* Адаптация для маленьких экранов */
    @media (max-width: 380px) {
      .nav-tab {
        padding: 0.5rem 0.6rem;
        font-size: 0.65rem;
      }
      .logo {
        font-size: 1.2rem;
      }
      .rank-info .name {
        font-size: 0.85rem;
      }
      .rank-score {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo">🪙 Clicker</div>
      <nav class="nav-tabs">
        <button class="nav-tab active" data-tab="game">Игра</button>
        <button class="nav-tab" data-tab="stats">Статистика</button>
        <button class="nav-tab" data-tab="profile">Профиль</button>
        <button class="nav-tab" data-tab="ranking">Рейтинг</button>
      </nav>
    </header>

    <main class="content">
      <section class="panel active game-panel" id="panel-game">
        <div class="score-card">
          <div class="score-label">Монеты</div>
          <p class="score-display" id="score">0</p>
          <p class="per-click">+<span id="perClick">1</span> за клик</p>
        </div>
        <div class="click-zone">
          <div class="click-target" id="clickTarget"><span>👆</span></div>
        </div>
        <h3 class="upgrades-title">Магазин улучшений</h3>
        <div class="upgrades" id="upgrades"></div>
      </section>

      <section class="panel" id="panel-stats">
        <h2 style="font-family: 'Unbounded'; font-size: 1.2rem; margin-bottom: 1rem;">📊 Статистика</h2>
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon">🖱️</div>
            <div class="stat-info">
              <h3>Всего кликов</h3>
              <p id="stat-clicks">0</p>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">💰</div>
            <div class="stat-info">
              <h3>Заработано всего</h3>
              <p id="stat-earned">0</p>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">🛒</div>
            <div class="stat-info">
              <h3>Покупок в магазине</h3>
              <p id="stat-purchases">0</p>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">⏱️</div>
            <div class="stat-info">
              <h3>Время в игре</h3>
              <p id="stat-time">0м</p>
            </div>
          </div>
        </div>
      </section>

      <section class="panel" id="panel-profile">
        <div class="profile-card">
          <div class="profile-avatar">👤</div>
          <div class="profile-section">
            <div class="profile-section-title">Имя</div>
            <div class="profile-section-value" id="profileName">—</div>
          </div>
          <div class="profile-section">
            <div class="profile-section-title">Username</div>
            <div class="profile-section-value" id="profileUsername">—</div>
          </div>
          <div class="profile-section">
            <div class="profile-section-title">ID в Telegram</div>
            <div class="profile-section-value" id="profileId">—</div>
          </div>
          <div class="profile-level">⭐ Уровень <span id="profileLevel">1</span></div>
          <div class="profile-stats">
            <div class="stat-card">
              <div class="stat-icon">💪</div>
              <div class="stat-info">
                <h3>Сила клика</h3>
                <p id="profilePower">1</p>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="panel" id="panel-ranking">
        <div class="ranking-header">
          <h2>🏆 Рейтинг игроков</h2>
          <p id="rankingSubtitle">Реальные игроки из Telegram</p>
        </div>
        <div class="ranking-list" id="rankingList">
          <div class="ranking-loading" id="rankingLoading">Загрузка рейтинга...</div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const TgWebApp = window.Telegram?.WebApp;
    const isTelegram = TgWebApp?.initDataUnsafe?.user;
    const tgUser = isTelegram ? TgWebApp.initDataUnsafe.user : null;

    if (isTelegram) {
      TgWebApp.ready();
      TgWebApp.expand();
      TgWebApp.enableClosingConfirmation();
      document.documentElement.style.setProperty('--bg', TgWebApp.themeParams?.bg_color || '#0a0a0f');
    }

    let db = null;
    if (typeof FIREBASE_ENABLED !== 'undefined' && FIREBASE_ENABLED && typeof firebase !== 'undefined') {
      try {
        firebase.initializeApp(FIREBASE_CONFIG);
        db = firebase.firestore();
      } catch (e) { console.warn('Firebase init error:', e); }
    }

    const state = {
      score: BigInt(0),
      totalClicks: 0,
      totalEarned: BigInt(0),
      totalSpent: BigInt(0),
      purchasesCount: 0,
      startTime: Date.now(),
      upgrades: [
        { id: 'cursor', name: 'Курсор', desc: '+1 за клик', cost: 10, value: 1, count: 0 },
        { id: 'grandma', name: 'Бабушка', desc: '+5 за клик', cost: 50, value: 5, count: 0 },
        { id: 'farm', name: 'Ферма', desc: '+25 за клик', cost: 200, value: 25, count: 0 },
        { id: 'mine', name: 'Шахта', desc: '+100 за клик', cost: 1000, value: 100, count: 0 },
        { id: 'factory', name: 'Завод', desc: '+500 за клик', cost: 5000, value: 500, count: 0 },
      ]
    };

    function getUserId() {
      if (tgUser) return String(tgUser.id);
      return 'local_' + (localStorage.getItem('clicker_device_id') || (localStorage.setItem('clicker_device_id', 'dev_' + Date.now()), localStorage.getItem('clicker_device_id')));
    }

    function getDisplayName() {
      if (tgUser) {
        const parts = [tgUser.first_name];
        if (tgUser.last_name) parts.push(tgUser.last_name);
        return parts.join(' ');
      }
      return 'Гость';
    }

    function getUsername() {
      if (tgUser?.username) return '@' + tgUser.username;
      return '—';
    }

    function getPerClick() {
      return 1 + state.upgrades.reduce((sum, u) => sum + u.value * u.count, 0);
    }

    function getLevel() {
      const power = getPerClick();
      const total = state.totalClicks + Number(state.totalEarned);
      return Math.max(1, Math.floor(Math.log10(total + 1) * 2) + Math.floor(power / 10));
    }

    const scoreEl = document.getElementById('score');
    const perClickEl = document.getElementById('perClick');
    const clickTarget = document.getElementById('clickTarget');
    const upgradesContainer = document.getElementById('upgrades');

    function formatNumber(val) {
      const n = typeof val === 'bigint' ? Number(val) : val;
      if (n >= 1e15) return (n / 1e15).toFixed(1) + 'Q';
      if (n >= 1e12) return (n / 1e12).toFixed(1) + 'T';
      if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
      if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
      if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
      return Math.floor(n).toString();
    }

    function formatTime(ms) {
      const sec = Math.floor(ms / 1000);
      const min = Math.floor(sec / 60);
      const hours = Math.floor(min / 60);
      if (hours > 0) return hours + 'ч ' + (min % 60) + 'м';
      if (min > 0) return min + 'м';
      return sec + 'с';
    }

    function getPlayerData() {
      return {
        userId: getUserId(),
        name: getDisplayName(),
        username: tgUser?.username || '',
        score: state.score.toString(),
        perClick: getPerClick(),
        totalClicks: state.totalClicks,
        totalEarned: state.totalEarned.toString(),
        totalSpent: state.totalSpent.toString(),
        purchasesCount: state.purchasesCount,
        startTime: state.startTime,
        upgrades: state.upgrades.map(u => ({ ...u })),
        updatedAt: Date.now(),
      };
    }

    async function saveToFirebase() {
      if (!db) return;
      try {
        await db.collection('players').doc(getUserId()).set(getPlayerData(), { merge: true });
      } catch (e) { console.warn('Firebase save error:', e); }
    }

    async function loadFromFirebase() {
      if (!db || !tgUser) return;
      try {
        const doc = await db.collection('players').doc(getUserId()).get();
        if (doc.exists) {
          const d = doc.data();
          state.score = BigInt(d.score || 0);
          state.totalClicks = d.totalClicks || 0;
          state.totalEarned = BigInt(d.totalEarned || 0);
          state.totalSpent = BigInt(d.totalSpent || 0);
          state.purchasesCount = d.purchasesCount || 0;
          state.startTime = d.startTime || Date.now();
          if (d.upgrades) {
            d.upgrades.forEach((u, i) => {
              if (state.upgrades[i]) state.upgrades[i].count = u.count || 0;
            });
          }
        }
      } catch (e) { console.warn('Firebase load error:', e); }
    }

    const STORAGE_KEY = 'clicker_save';

    function getSaveData() {
      return JSON.stringify({
        score: state.score.toString(),
        totalClicks: state.totalClicks,
        totalEarned: state.totalEarned.toString(),
        totalSpent: state.totalSpent.toString(),
        purchasesCount: state.purchasesCount,
        startTime: state.startTime,
        upgrades: state.upgrades.map(u => ({ ...u })),
      });
    }

    function saveState() {
      const data = getSaveData();
      const key = STORAGE_KEY + '_' + getUserId();
      localStorage.setItem(key, data);
      if (db) saveToFirebase();
      if (isTelegram && TgWebApp?.CloudStorage) {
        const cs = TgWebApp.CloudStorage;
        if (cs.setItem) cs.setItem(key, data);
        else if (cs.set) cs.set(key, data);
      }
    }

    function loadState(callback) {
      const key = STORAGE_KEY + '_' + getUserId();
      function applyData(data) {
        if (!data) return;
        try {
          const d = typeof data === 'string' ? JSON.parse(data) : data;
          state.score = BigInt(d.score || 0);
          state.totalClicks = d.totalClicks || 0;
          state.totalEarned = BigInt(d.totalEarned || 0);
          state.totalSpent = BigInt(d.totalSpent || 0);
          state.purchasesCount = d.purchasesCount || 0;
          state.startTime = d.startTime || Date.now();
          if (d.upgrades) {
            d.upgrades.forEach((u, i) => {
              if (state.upgrades[i]) state.upgrades[i].count = u.count || 0;
            });
          }
        } catch (e) {}
        if (callback) callback();
      }
      if (isTelegram && TgWebApp?.CloudStorage) {
        const cs = TgWebApp.CloudStorage;
        const onCloud = (val) => {
          if (val && val !== '') applyData(val);
          else tryLocal();
          if (callback) callback();
        };
        if (cs.getItems) {
          cs.getItems([key], (obj) => { onCloud(obj && obj[key]); });
        } else if (cs.getItem) {
          cs.getItem(key, onCloud);
        } else if (cs.get) {
          const p = cs.get(key);
          if (p && p.then) p.then(onCloud).catch(() => { tryLocal(); if (callback) callback(); });
          else tryLocal();
        } else tryLocal();
      } else tryLocal();

      function tryLocal() {
        try {
          const data = localStorage.getItem(key);
          if (data) applyData(data);
        } catch (e) {}
        if (callback) callback();
      }
    }

    function render() {
      const perClick = getPerClick();
      scoreEl.textContent = formatNumber(state.score);
      perClickEl.textContent = formatNumber(perClick);

      upgradesContainer.innerHTML = state.upgrades.map((u, i) => {
        const nextCost = Math.floor(u.cost * Math.pow(1.15, u.count));
        const locked = state.score < BigInt(nextCost);
        return `
          <div class="upgrade ${locked ? 'locked' : 'unlocked'}" data-index="${i}">
            <div class="upgrade-info">
              <h3>${u.name}</h3>
              <p>${u.desc}${u.count > 0 ? ` · Куплено: ${u.count}` : ''}</p>
            </div>
            <div>
              <span class="upgrade-cost">${formatNumber(nextCost)}</span>
              <span style="color:var(--text-muted);font-size:0.8rem;">🪙</span>
            </div>
          </div>
        `;
      }).join('');

      document.querySelectorAll('.upgrade.unlocked').forEach(el => {
        el.addEventListener('click', () => buyUpgrade(parseInt(el.dataset.index)));
      });

      renderStats();
      renderProfile();
      renderRanking();
      saveState();
    }

    function renderStats() {
      const elapsed = Date.now() - state.startTime;
      document.getElementById('stat-clicks').textContent = formatNumber(state.totalClicks);
      document.getElementById('stat-earned').textContent = formatNumber(state.totalEarned + state.totalSpent);
      document.getElementById('stat-purchases').textContent = state.purchasesCount;
      document.getElementById('stat-time').textContent = formatTime(elapsed);
    }

    function renderProfile() {
      document.getElementById('profileName').textContent = getDisplayName();
      document.getElementById('profileName').className = 'profile-section-value' + (isTelegram ? '' : ' muted');
      if (isTelegram) {
        document.getElementById('profileName').innerHTML = getDisplayName() + ' <span class="tg-badge">Telegram</span>';
      }
      document.getElementById('profileUsername').textContent = getUsername();
      document.getElementById('profileUsername').className = 'profile-section-value' + (tgUser?.username ? '' : ' muted');
      document.getElementById('profileId').textContent = tgUser ? tgUser.id : (getUserId().startsWith('local_') ? getUserId() : '—');
      document.getElementById('profileLevel').textContent = getLevel();
      document.getElementById('profilePower').textContent = formatNumber(getPerClick());
    }

    async function renderRanking() {
      const listEl = document.getElementById('rankingList');
      const loadingEl = document.getElementById('rankingLoading');

      if (db) {
        loadingEl.style.display = 'block';
        listEl.innerHTML = '';
        listEl.appendChild(loadingEl);
        try {
          const snapshot = await db.collection('players')
            .orderBy('score', 'desc')
            .limit(50)
            .get();
          const players = [];
          snapshot.forEach(doc => {
            const d = doc.data();
            players.push({
              name: d.name || 'Игрок',
              username: d.username,
              score: Number(d.score || 0),
              perClick: d.perClick || 0,
              isPlayer: doc.id === getUserId(),
            });
          });
          loadingEl.style.display = 'none';
          document.getElementById('rankingSubtitle').textContent = 'Реальные игроки из Telegram';
          listEl.innerHTML = players.length ? players.map((p, i) => `
            <div class="rank-item ${p.isPlayer ? 'player' : ''}">
              <div class="rank-position">${i + 1}</div>
              <div class="rank-info">
                <div class="name">${p.name}${p.username ? ' <span style="color:var(--text-muted)">@' + p.username + '</span>' : ''}</div>
                <div class="power">${p.perClick ? 'Сила: ' + formatNumber(p.perClick) : ''}</div>
              </div>
              <div class="rank-score">${formatNumber(p.score)}</div>
            </div>
          `).join('') : '<div class="ranking-loading">Пока никого нет. Будь первым!</div>';
        } catch (e) {
          loadingEl.textContent = 'Ошибка загрузки. Проверь настройку Firebase.';
          loadingEl.style.display = 'block';
        }
      } else {
        document.getElementById('rankingSubtitle').textContent = 'Только ты (Firebase не настроен)';
        loadingEl.style.display = 'none';
        const me = {
          name: getDisplayName(),
          username: tgUser?.username || '',
          score: Number(state.score),
          perClick: getPerClick(),
          isPlayer: true
        };
        listEl.innerHTML = `
          <div class="rank-item player">
            <div class="rank-position">1</div>
            <div class="rank-info">
              <div class="name">${me.name}${me.username ? ' <span style="color:var(--text-muted)">@' + me.username + '</span>' : ''}</div>
              <div class="power">Сила: ${formatNumber(me.perClick)}</div>
            </div>
            <div class="rank-score">${formatNumber(me.score)}</div>
          </div>
          <div class="ranking-loading" style="margin-top:1rem;font-size:0.85rem;">
            🔧 Чтобы видеть других игроков: настрой Firebase в config.js
          </div>
        `;
      }
    }

    function buyUpgrade(index) {
      const u = state.upgrades[index];
      const cost = Math.floor(u.cost * Math.pow(1.15, u.count));
      const costBig = BigInt(cost);
      if (state.score >= costBig) {
        state.score -= costBig;
        state.totalSpent += costBig;
        state.purchasesCount++;
        u.count++;
        render();
      }
    }

    document.querySelectorAll('.nav-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
        if (tab.dataset.tab === 'ranking') renderRanking();
      });
    });

    clickTarget.addEventListener('click', () => {
      const gain = BigInt(getPerClick());
      state.score += gain;
      state.totalEarned += gain;
      state.totalClicks++;
      render();
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') saveState();
    });
    window.addEventListener('pagehide', () => saveState());

    (async () => {
      if (db && tgUser) await loadFromFirebase();
      await new Promise(resolve => loadState(resolve));
      render();
    })();
  </script>
</body>
</html>
